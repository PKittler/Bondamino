# Builds the container image (linux/amd64 and linux/arm64) and publishes it to this project's
# GitLab Container Registry ($CI_REGISTRY_IMAGE): on every push to the default branch as
# "latest", on tags vX.Y.Z with the version number (e.g. v1.2.3 -> 1.2.3 and 1.2). Can also be
# started manually (Build -> Pipelines -> Run pipeline) on the default branch.
#
# Needs a runner that can run Docker-in-Docker (privileged), e.g. the GitLab.com shared runners.

stages:
  - build

docker-image:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    PLATFORMS: linux/amd64,linux/arm64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # QEMU emulation so that the arm64 image can be built on an amd64 runner
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --name multiarch --driver docker-container --use
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        version="${CI_COMMIT_TAG#v}"
        tags="--tag $CI_REGISTRY_IMAGE:$version --tag $CI_REGISTRY_IMAGE:${version%.*}"
      else
        tags="--tag $CI_REGISTRY_IMAGE:latest"
      fi
      docker buildx build --platform "$PLATFORMS" --push $tags \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
        .
