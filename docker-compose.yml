# Bondamino with PostgreSQL. Start: docker compose up -d
# Variables in the file .env next to this file (template: .env.example) or in Portainer.
# Alternatives: docker-compose.mariadb.yml (MariaDB) and docker-compose.sqlite.yml (SQLite).
# The meaning of the variables is described in INSTALL.md, section "Configuration reference".
services:
  bondamino:
    image: ${BONDAMINO_IMAGE:-registry.gitlab.com/d11m-group/bondamino:latest}
    build: .
    restart: unless-stopped
    ports:
      # Only reachable from this computer by default (for a reverse proxy on the same host).
      # Set BONDAMINO_PORT=8000 to make it reachable from other computers without a proxy, but
      # never together with HTTPS=1: clients could then forge X-Forwarded-For.
      - "${BONDAMINO_PORT:-127.0.0.1:8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bondamino:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/bondamino
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      HTTPS: ${HTTPS:-0}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      DEBUG: ${DEBUG:-0}
      LOG_LEVEL: ${LOG_LEVEL:-WARNING}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      # Leave empty: the key is generated on the first start and stored in /data
      SECRET_KEY: ${SECRET_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # First administrator; only created as long as there is no superuser yet
      DJANGO_SUPERUSER_USERNAME: ${ADMIN_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${ADMIN_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - bondamino-data:/data

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bondamino
      POSTGRES_USER: bondamino
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bondamino -d bondamino"]
      interval: 5s
      retries: 30

volumes:
  bondamino-data:
  postgres-data:
